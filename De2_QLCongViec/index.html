<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Công Việc</title>

    <!--
      Bootstrap 5 CSS - lấy từ CDN, không cần cài đặt.
      Bootstrap cung cấp sẵn các class như: btn, card, badge,
      form-control, container, row, col, ... để tạo giao diện nhanh.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />

    <!--
      Bootstrap Icons - thư viện icon miễn phí của Bootstrap.
      Dùng bằng cách: <i class="bi bi-tên-icon"></i>
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!--
      Đây là "điểm gắn" của React.
      React sẽ render toàn bộ giao diện vào trong thẻ div này.
      Ban đầu nó rỗng, React sẽ tự điền nội dung vào.
    -->
    <div id="root"></div>

    <!--
      File JS chính được build bởi Vite.
      type="module" cho phép dùng ES Modules (import/export).
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
